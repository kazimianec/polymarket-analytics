version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8001}:${BACKEND_PORT:-8000}"
    environment:
      - ENV_FOR_DYNACONF=${DEPLOY_ENV:-docker}
      - PYTHONPATH=/app/src
      # dynaconf parses this as a list; quotes guard against shell/compose YAML token splitting on `[`
      - "APP_CORS_ORIGINS=[\"http://localhost:${FRONTEND_HOST_PORT:-5174}\",\"http://127.0.0.1:${FRONTEND_HOST_PORT:-5174}\"]"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:${VITE_PORT:-5173}"
    environment:
      - VITE_API_TARGET=http://backend:${BACKEND_PORT:-8000}
      - VITE_PORT=${VITE_PORT:-5173}
    depends_on:
      - backend

